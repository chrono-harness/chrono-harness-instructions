name: Publish verified rules
on:
  workflow_run:
    workflows: [check]
    branches: [dev]
    types: [completed]
permissions:
  contents: read
jobs:
  publish-rules:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-agent-rules
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Publish the checked public rule data
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: cargo run --quiet --locked --manifest-path crates/instructions/Cargo.toml --example publish_rules
