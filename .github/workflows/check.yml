name: check
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78
        with:
          version: 2026.11.12
          cache: false
          install_args: http:verus http:chrono-harness http:chrono-host-bootstrap
      - run: VERUS="$(mise which verus)" ./check.sh
  publish-rules:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-agent-rules
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Publish the checked public rule data
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/rules"
          mkdir -p "$stage"
          cargo run --quiet --locked --manifest-path crates/instructions/Cargo.toml --bin chrono-instructions -- publish-rules > "$stage/rules.json"
          cp docs/licenses/* "$stage/"
          upstream=$(git ls-remote origin refs/heads/dev)
          if [[ "${upstream%%[[:space:]]*}" != "$GITHUB_SHA" ]]; then
            echo "A newer development revision will publish its rules."
            exit 0
          fi
          published=$(git ls-remote --heads origin refs/heads/published-rules)
          if [[ -n "$published" ]]; then
            git fetch --no-tags --depth=1 origin refs/heads/published-rules
            git switch --detach FETCH_HEAD
          else
            git switch --orphan published-rules
          fi
          cp "$stage"/* .
          git add -- rules.json methodology-attribution.md trureturing-Apache-2.0.txt
          if ! git diff --cached --quiet; then
            git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Publish rules from $GITHUB_SHA"
            git push origin HEAD:refs/heads/published-rules
          fi
