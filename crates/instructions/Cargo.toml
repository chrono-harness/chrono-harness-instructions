[package]
name = "chrono-instructions"
version = "0.1.0"
edition = "2024"
publish = false
description = "Explicit, preserving host instruction generation"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(verus_keep_ghost)", "cfg(verus_keep_ghost_body)"] }

[lib]
test = false
doctest = false

[[bin]]
name = "chrono-instructions"
path = "src/main.rs"
test = false
bench = false

[features]
test-support = ["chrono-harness/retention-test"]

[dependencies]
chrono-diagnostics = { git = "https://github.com/chrono-harness/chrono-harness-diagnostics.git", rev = "8da697ff878dbe2e31ddcfe7366714de49e79d03" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono-harness = { git = "https://github.com/chrono-harness/chrono-harness-runner.git", rev = "5c9364711a47ab45242195f11ca350e5d2b858cf" }
verus_builtin_macros = "=0.0.0-2026-04-20-1748"
libc = "0.2"
