[package]
name = "chrono-instructions"
version = "0.1.11"
edition = "2024"
publish = false
autotests = false
description = "Explicit, preserving host instruction generation"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(verus_keep_ghost)", "cfg(verus_keep_ghost_body)"] }

[lib]
test = false
doctest = false

[[bin]]
name = "chrono-instructions"
path = "src/main.rs"
test = false
bench = false

[features]
test-support = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustix = { version = "1", features = ["fs"] }
tempfile = "3"
sha2 = "0.11"
verus_builtin_macros = "=0.0.0-2026-11-22-0344"
libc = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
regex = { version = "1.12", default-features = false, features = ["std", "perf"] }
