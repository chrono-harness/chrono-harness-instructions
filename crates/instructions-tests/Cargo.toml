[package]
name = "chrono-instructions-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dev-dependencies]
sha2 = "0.11"
serde_yaml = { package = "serde_yaml_ng", version = "=0.10.0" }
chrono-instructions = { path = "../instructions", features = ["test-support"] }
serde_json = "1"
tempfile = "3"
verus_builtin_macros = "=0.0.0-2026-11-22-0344"

[[test]]
name = "generation"
path = "tests/generation.rs"

[[test]]
name = "publication_decision"
path = "tests/publication_decision.rs"

[[test]]
name = "github_event"
path = "tests/github_event.rs"

[[test]]
name = "event_identity"
path = "tests/event_identity.rs"

[[test]]
name = "rule_selection"
path = "tests/rule_selection.rs"
