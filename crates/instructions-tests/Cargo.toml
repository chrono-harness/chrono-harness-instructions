[package]
name = "chrono-instructions-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
chrono-test-process = { git = "https://github.com/chrono-harness/chrono-harness-runner.git", rev = "5c9364711a47ab45242195f11ca350e5d2b858cf" }
chrono-instructions = { path = "../instructions", features = ["test-support"] }
chrono-diagnostics = { git = "https://github.com/chrono-harness/chrono-harness-diagnostics.git", rev = "8da697ff878dbe2e31ddcfe7366714de49e79d03" }

[dev-dependencies]
libc = "0.2"
verus_builtin_macros = "=0.0.0-2026-04-20-1748"
chrono-harness = { git = "https://github.com/chrono-harness/chrono-harness-runner.git", rev = "5c9364711a47ab45242195f11ca350e5d2b858cf", features = ["retention-test"] }
tempfile = "3"
serde_json = "1"

[[test]]
name = "generation"
path = "tests/generation.rs"

[[bin]]
name = "chrono-test-instructions"
path = "../instructions/src/main.rs"
test = false
bench = false

[[test]]
name = "publication_decision"
path = "tests/publication_decision.rs"
